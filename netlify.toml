[build]
  base = "app"
  # Eerst de tests, dan pas bouwen. Bij automatisch publiceren gaat elke
  # wijziging rechtstreeks live; deze regel is het enige dat daartussen
  # zit. Faalt een test of een typecontrole, dan mislukt de build en
  # blijft de vorige versie gewoon draaien.
  command = "npm run test && npm run build"
  publish = "dist"

[build.environment]
  # Vastzetten zodat een nieuwe standaardversie bij Netlify de build niet
  # ineens anders laat verlopen dan op je eigen computer.
  NODE_VERSION = "20"

# React Router draait client-side: elke URL moet index.html serveren,
# anders geeft Netlify een 404 bij het rechtstreeks openen van bijv.
# /evenementen/EVT-2026-014 of bij het verversen van een subpagina.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # De camera is nodig voor barcodescanning; verder niets toestaan.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
