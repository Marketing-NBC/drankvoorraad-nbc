# Lokale Supabase voor de testomgeving (Supabase CLI, draait in Docker).
# Productie staat hier los van: dit bestand wordt alleen gelezen door
# `supabase start` op je eigen computer. Zie TESTOMGEVING.md.
#
# Alleen wat de app gebruikt staat aan: database, inloggen, realtime, de
# Edge Functions (`gebruikers`) en Studio om in de gegevens te kijken.

project_id = "drankvoorraad-nbc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Gelijk aan productie, anders past de kopie er niet in.
major_version = 17

# De schemawijzigingen staan als genummerde bestanden in supabase/migraties/
# (niet in het formaat van de CLI). De testomgeving wordt gevuld met een
# kopie van productie via `npm run lokaal:kopie`, niet via migraties of
# seed.sql — die laatste is voor een lege database met voorbeeldgegevens.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Net als productie: accounts maakt de beheerder aan, niemand meldt zich zelf.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = false
